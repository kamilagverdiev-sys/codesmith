<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codesmith</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-2: #11151c;
    --bg-3: #161b24;
    --line: #1f2630;
    --fg: #e6edf3;
    --fg-dim: #8b98a8;
    --fg-faint: #5c6773;
    --accent: #7aa2f7;
    --accent-2: #bb9af7;
    --green: #9ece6a;
    --yellow: #e0af68;
    --red: #f7768e;
    --tool: #2ac3de;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    height: 100%;
  }
  body { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
  }
  header .brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(158, 206, 106, 0.7);
  }
  header .brand .dot.bad { background: var(--red); box-shadow: 0 0 8px rgba(247,118,142,0.7); }
  header .meta {
    display: flex;
    gap: 16px;
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 12px;
  }
  header .meta span b { color: var(--fg); font-weight: 500; }
  header button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg-dim);
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  header button:hover { color: var(--fg); border-color: var(--accent); }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px max(20px, calc((100vw - 880px) / 2));
  }
  .empty {
    color: var(--fg-faint);
    text-align: center;
    margin-top: 80px;
    font-size: 13px;
  }
  .empty h1 {
    color: var(--fg);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .empty .examples {
    margin-top: 24px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .empty .examples button {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--fg-dim);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--mono);
  }
  .empty .examples button:hover { color: var(--fg); border-color: var(--accent); }

  .turn { margin-bottom: 28px; }
  .turn .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-faint);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .turn.user .who { color: var(--accent); }
  .turn.assistant .who { color: var(--accent-2); }
  .bubble {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .turn.user .bubble { border-left: 3px solid var(--accent); }
  .turn.assistant .bubble { border-left: 3px solid var(--accent-2); }

  .step {
    margin-top: 12px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .step .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg-2);
    cursor: pointer;
    user-select: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
  }
  .step .head:hover { color: var(--fg); }
  .step .head .left { display: flex; align-items: center; gap: 10px; }
  .step .head .iter {
    background: var(--line);
    color: var(--fg);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .step .head .tool-name {
    color: var(--tool);
  }
  .step .body {
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    display: none;
  }
  .step.open .body { display: block; }
  .step .text { white-space: pre-wrap; line-height: 1.5; color: var(--fg); }
  .step .tool-result {
    margin-top: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--fg-dim);
    white-space: pre-wrap;
    max-height: 320px;
    overflow-y: auto;
  }
  .step .tool-result.bad { border-color: var(--red); }

  .stats {
    margin-top: 14px;
    color: var(--fg-faint);
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    gap: 16px;
  }
  .stats .warn { color: var(--yellow); }

  .typing {
    color: var(--fg-faint);
    font-style: italic;
    font-size: 12px;
    padding: 6px 0;
  }
  .typing::after {
    content: '';
    display: inline-block;
    width: 8px;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20%   { content: ''; }
    40%       { content: '.'; }
    60%       { content: '..'; }
    80%, 100% { content: '...'; }
  }

  .err {
    color: var(--red);
    background: rgba(247,118,142,0.08);
    border: 1px solid rgba(247,118,142,0.4);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 12px;
  }

  footer {
    flex: 0 0 auto;
    background: var(--bg-2);
    border-top: 1px solid var(--line);
    padding: 14px max(20px, calc((100vw - 880px) / 2));
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 14px;
    resize: none;
    line-height: 1.5;
    max-height: 200px;
    transition: border-color 0.15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .send {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 0 20px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: opacity 0.15s;
    flex: 0 0 auto;
  }
  .send:hover { opacity: 0.85; }
  .send:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint {
    color: var(--fg-faint);
    font-size: 11px;
    font-family: var(--mono);
    margin-top: 6px;
    text-align: right;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="status-dot" title="api status"></span>
    <span>codesmith</span>
    <span style="color: var(--fg-faint); font-weight: 400;">— hybrid coder agent</span>
  </div>
  <div class="meta" id="meta">
    <span>loading…</span>
  </div>
  <div>
    <button id="new-session" title="Drop current session and start fresh">new session</button>
  </div>
</header>

<main id="chat">
  <div class="empty" id="empty">
    <h1>codesmith</h1>
    <div>Спросите что-нибудь, и агент возьмётся в sandbox.</div>
    <div class="examples">
      <button data-prompt="Напиши функцию Фибоначчи на Python и проверь её на n=10.">fib(10)</button>
      <button data-prompt="Создай файл hello.py с print('hi') и запусти его.">create + run hello.py</button>
      <button data-prompt="Сколько простых чисел между 1 и 1000? Посчитай в sandbox.">primes ≤ 1000</button>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea
      id="input"
      placeholder="Введите сообщение…  (Ctrl+Enter — отправить)"
      rows="2"
    ></textarea>
    <button class="send" id="send">Отправить</button>
  </div>
  <div class="hint">Ctrl+Enter — send · Esc — cancel · sandbox: docker, network=none</div>
</footer>

<script>
const $ = (sel) => document.querySelector(sel);
const chatEl = $('#chat');
const emptyEl = $('#empty');
const inputEl = $('#input');
const sendBtn = $('#send');
const statusDot = $('#status-dot');
const metaEl = $('#meta');
const newSessionBtn = $('#new-session');

let sessionId = null;
let inflight = null; // { abort: () => void }

// ---- helpers ----
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function clearEmpty() {
  if (emptyEl && emptyEl.parentNode) emptyEl.remove();
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function shortArgs(keys) {
  if (!keys || keys.length === 0) return '()';
  return '(' + keys.join(', ') + ')';
}

// ---- session management ----
async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch('/api/sessions', { method: 'POST' });
  if (!r.ok) throw new Error('failed to create session');
  const data = await r.json();
  sessionId = data.session_id;
  return sessionId;
}

async function dropSession() {
  if (!sessionId) return;
  try { await fetch('/api/sessions/' + sessionId, { method: 'DELETE' }); }
  catch (e) { /* ignore */ }
  sessionId = null;
}

// ---- info / health ----
async function loadInfo() {
  try {
    const r = await fetch('/api/info');
    if (!r.ok) throw new Error('info failed');
    const info = await r.json();
    metaEl.innerHTML = '';
    const items = [
      ['llm', info.primary_provider + '/' + info.primary_model],
      ['sandbox', info.sandbox_image + '  ' + info.sandbox_memory_mb + 'MB · ' + info.sandbox_cpus + 'cpu · ' + info.sandbox_timeout_s + 's'],
      ['v', info.version],
    ];
    for (const [label, val] of items) {
      const span = el('span', {}, label + ': ', el('b', { text: val }));
      metaEl.appendChild(span);
    }
    statusDot.classList.remove('bad');
    statusDot.title = 'api ok';
  } catch (e) {
    statusDot.classList.add('bad');
    statusDot.title = 'api unreachable';
    metaEl.innerHTML = '';
    metaEl.appendChild(el('span', { text: 'api unreachable' }));
  }
}

// ---- sending ----
async function send() {
  const message = inputEl.value.trim();
  if (!message) return;
  if (inflight) return;

  clearEmpty();
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  try {
    await ensureSession();
  } catch (e) {
    showError('Не удалось создать сессию: ' + e.message);
    sendBtn.disabled = false;
    return;
  }

  // Render user turn
  const userTurn = el('div', { class: 'turn user' },
    el('div', { class: 'who', text: 'you' }),
    el('div', { class: 'bubble', text: message })
  );
  chatEl.appendChild(userTurn);

  // Assistant turn shell
  const assistantTurn = el('div', { class: 'turn assistant' },
    el('div', { class: 'who', text: 'codesmith' }),
  );
  const stepsContainer = el('div', { class: 'steps' });
  const typingEl = el('div', { class: 'typing', text: 'agent thinking' });
  assistantTurn.appendChild(typingEl);
  assistantTurn.appendChild(stepsContainer);
  const finalBubble = el('div', { class: 'bubble', style: 'display: none;' });
  assistantTurn.appendChild(finalBubble);
  const statsEl = el('div', { class: 'stats', style: 'display: none;' });
  assistantTurn.appendChild(statsEl);
  chatEl.appendChild(assistantTurn);
  scrollToBottom();

  // POST + streaming with fetch (EventSource doesn't support POST bodies)
  const controller = new AbortController();
  inflight = { abort: () => controller.abort() };

  let resp;
  try {
    resp = await fetch('/api/sessions/' + sessionId + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ message }),
      signal: controller.signal,
    });
  } catch (e) {
    typingEl.remove();
    showError('Запрос упал: ' + e.message, assistantTurn);
    inflight = null;
    sendBtn.disabled = false;
    return;
  }

  if (!resp.ok || !resp.body) {
    typingEl.remove();
    showError('HTTP ' + resp.status + ': ' + resp.statusText, assistantTurn);
    inflight = null;
    sendBtn.disabled = false;
    return;
  }

  // Parse SSE stream
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // Split events by blank line
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const event = parseSSE(raw);
        if (!event) continue;
        handleEvent(event, { stepsContainer, typingEl, finalBubble, statsEl, assistantTurn });
        scrollToBottom();
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      showError('Stream упал: ' + e.message, assistantTurn);
    }
  } finally {
    typingEl.remove();
    inflight = null;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function parseSSE(raw) {
  const lines = raw.split('\n');
  let event = 'message';
  let data = '';
  for (const line of lines) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; }
  catch { return { event, data: {} }; }
}

function handleEvent(ev, ctx) {
  if (ev.event === 'ping') return;

  if (ev.event === 'start') {
    ctx.typingEl.textContent = 'agent thinking';
    return;
  }

  if (ev.event === 'step') {
    const d = ev.data;
    const stepEl = el('div', { class: 'step open' });
    const toolNames = (d.tool_calls || []).map(tc => tc.name + shortArgs(tc.args_keys));
    const headLeft = el('div', { class: 'left' },
      el('span', { class: 'iter', text: 'step ' + d.iteration }),
      toolNames.length > 0
        ? el('span', { class: 'tool-name', text: toolNames.join(', ') })
        : el('span', { text: 'final response' })
    );
    const headRight = el('span', { text: (d.tokens || 0) + ' tok · click to toggle' });
    const head = el('div', { class: 'head' }, headLeft, headRight);
    head.addEventListener('click', () => stepEl.classList.toggle('open'));

    const body = el('div', { class: 'body' });
    if (d.assistant_text && d.assistant_text.trim()) {
      body.appendChild(el('div', { class: 'text', text: d.assistant_text }));
    }
    for (const tr of (d.tool_results || [])) {
      body.appendChild(el('div', {
        class: 'tool-result' + (tr.ok ? '' : ' bad'),
        text: tr.preview || '(empty)',
      }));
    }
    if (!body.children.length) {
      body.appendChild(el('div', { class: 'text', style: 'color: var(--fg-faint);', text: '(no content)' }));
    }
    stepEl.appendChild(head);
    stepEl.appendChild(body);
    ctx.stepsContainer.appendChild(stepEl);
    return;
  }

  if (ev.event === 'final') {
    const d = ev.data;
    ctx.typingEl.remove();
    ctx.finalBubble.style.display = '';
    ctx.finalBubble.textContent = d.text || '(no text)';
    ctx.statsEl.style.display = '';
    ctx.statsEl.innerHTML = '';
    ctx.statsEl.appendChild(el('span', { text: 'steps: ' + d.steps }));
    ctx.statsEl.appendChild(el('span', { text: 'tokens: ' + d.tokens }));
    if (d.hit_limit) {
      ctx.statsEl.appendChild(el('span', { class: 'warn', text: '⚠ hit iteration limit' }));
    }
    return;
  }

  if (ev.event === 'error') {
    ctx.typingEl.remove();
    showError(ev.data.error || 'unknown error', ctx.assistantTurn);
    return;
  }
}

function showError(msg, parent) {
  const errEl = el('div', { class: 'err', text: msg });
  (parent || chatEl).appendChild(errEl);
  scrollToBottom();
}

// ---- input UX ----
inputEl.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    send();
  }
  if (e.key === 'Escape' && inflight) {
    inflight.abort();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});
sendBtn.addEventListener('click', send);
newSessionBtn.addEventListener('click', async () => {
  if (inflight) inflight.abort();
  await dropSession();
  chatEl.innerHTML = '';
  chatEl.appendChild(emptyEl);
  inputEl.focus();
});

document.addEventListener('click', (e) => {
  if (e.target.matches('.examples button')) {
    inputEl.value = e.target.dataset.prompt;
    inputEl.focus();
  }
});

loadInfo();
inputEl.focus();
</script>
</body>
</html>
