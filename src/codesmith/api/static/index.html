<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codesmith</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-2: #11151c;
    --bg-3: #161b24;
    --line: #1f2630;
    --fg: #e6edf3;
    --fg-dim: #8b98a8;
    --fg-faint: #5c6773;
    --accent: #7aa2f7;
    --accent-2: #bb9af7;
    --green: #9ece6a;
    --yellow: #e0af68;
    --red: #f7768e;
    --tool: #2ac3de;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    height: 100%;
  }
  body { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
  }
  header .brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(158, 206, 106, 0.7);
  }
  header .brand .dot.bad { background: var(--red); box-shadow: 0 0 8px rgba(247,118,142,0.7); }
  header .meta {
    display: flex;
    gap: 16px;
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 12px;
  }
  header .meta span b { color: var(--fg); font-weight: 500; }
  header .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header button,
  header select {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg-dim);
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  header button:hover,
  header select:hover { color: var(--fg); border-color: var(--accent); }
  header select:focus { outline: none; border-color: var(--accent); color: var(--fg); }
  header select option {
    background: var(--bg-2);
    color: var(--fg);
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--fg-dim);
    font-size: 12px;
    font-family: var(--mono);
    user-select: none;
  }
  .toggle input { accent-color: var(--accent); }
  .model-status {
    color: var(--fg-faint);
    font-size: 11px;
    font-family: var(--mono);
    text-align: right;
    min-width: 180px;
  }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px max(20px, calc((100vw - 880px) / 2));
  }
  .empty {
    color: var(--fg-faint);
    text-align: center;
    margin-top: 80px;
    font-size: 13px;
  }
  .empty h1 {
    color: var(--fg);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .empty .examples {
    margin-top: 24px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .empty .examples button {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--fg-dim);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--mono);
  }
  .empty .examples button:hover { color: var(--fg); border-color: var(--accent); }

  .turn { margin-bottom: 28px; }
  .turn .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-faint);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .turn.user .who { color: var(--accent); }
  .turn.assistant .who { color: var(--accent-2); }
  .bubble {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .turn.user .bubble { border-left: 3px solid var(--accent); }
  .turn.assistant .bubble { border-left: 3px solid var(--accent-2); }

  .bubble .md p { margin: 0 0 10px 0; }
  .bubble .md p:last-child { margin-bottom: 0; }
  .bubble .md h1,
  .bubble .md h2,
  .bubble .md h3 {
    margin: 12px 0 6px 0;
    font-weight: 600;
    color: var(--fg);
  }
  .bubble .md h1 { font-size: 17px; }
  .bubble .md h2 { font-size: 15px; }
  .bubble .md h3 { font-size: 14px; }
  .bubble .md ul {
    margin: 4px 0 10px 0;
    padding-left: 22px;
  }
  .bubble .md li { margin: 2px 0; }
  .bubble .md code {
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--tool);
  }
  .bubble .md pre {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    margin: 10px 0;
    overflow-x: auto;
    position: relative;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    color: var(--fg);
  }
  .bubble .md pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: inherit;
    font-size: inherit;
  }
  .bubble .md pre .lang {
    position: absolute;
    top: 6px;
    right: 10px;
    font-size: 10px;
    color: var(--fg-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .copy-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .copy-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg-faint);
    padding: 4px 10px;
    font-size: 11px;
    font-family: var(--mono);
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { color: var(--fg); border-color: var(--accent); }
  .copy-btn.done { color: var(--green); border-color: var(--green); }

  /* Runs panel — observability tail, only visible in debug mode */
  .runs-panel {
    position: fixed;
    right: 20px;
    bottom: 110px;
    width: 320px;
    max-height: 360px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
  }
  .runs-panel.visible { display: flex; }
  .runs-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg-3);
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .runs-head .refresh {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg-dim);
    padding: 2px 8px;
    font-size: 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--mono);
    text-transform: none;
    letter-spacing: 0;
  }
  .runs-head .refresh:hover { color: var(--fg); border-color: var(--accent); }
  .runs-body {
    overflow-y: auto;
    padding: 6px 0;
  }
  .run-item {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.45;
    color: var(--fg-dim);
  }
  .run-item:last-child { border-bottom: none; }
  .run-item .top {
    display: flex;
    justify-content: space-between;
    color: var(--fg);
    font-weight: 500;
  }
  .run-item .top .flag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .run-item .top .flag.ok { background: rgba(158,206,106,0.12); color: var(--green); }
  .run-item .top .flag.err { background: rgba(247,118,142,0.12); color: var(--red); }
  .run-item .top .flag.forced { background: rgba(224,175,104,0.12); color: var(--yellow); }
  .run-item .stats {
    display: flex;
    gap: 10px;
    color: var(--fg-faint);
    font-size: 10px;
    margin-top: 2px;
  }
  .run-item .msg {
    margin-top: 3px;
    color: var(--fg-faint);
    font-family: var(--sans);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    white-space: normal;
  }
  .runs-empty {
    color: var(--fg-faint);
    text-align: center;
    padding: 20px 12px;
    font-size: 11px;
  }

  .step {
    margin-top: 12px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .step .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg-2);
    cursor: pointer;
    user-select: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
  }
  .step .head:hover { color: var(--fg); }
  .step .head .left { display: flex; align-items: center; gap: 10px; }
  .step .head .iter {
    background: var(--line);
    color: var(--fg);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .step .head .tool-name {
    color: var(--tool);
  }
  .step .body {
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    display: none;
  }
  .step.open .body { display: block; }
  .step .text { white-space: pre-wrap; line-height: 1.5; color: var(--fg); }
  .step .tool-result {
    margin-top: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--fg-dim);
    white-space: pre-wrap;
    max-height: 320px;
    overflow-y: auto;
  }
  .step .tool-result.bad { border-color: var(--red); }

  .stats {
    margin-top: 14px;
    color: var(--fg-faint);
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    gap: 16px;
  }
  .stats .warn { color: var(--yellow); }

  .typing {
    color: var(--fg-faint);
    font-style: italic;
    font-size: 12px;
    padding: 6px 0;
  }
  .typing::after {
    content: '';
    display: inline-block;
    width: 8px;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20%   { content: ''; }
    40%       { content: '.'; }
    60%       { content: '..'; }
    80%, 100% { content: '...'; }
  }

  .err {
    color: var(--red);
    background: rgba(247,118,142,0.08);
    border: 1px solid rgba(247,118,142,0.4);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
  }
  .err b {
    display: block;
    color: var(--red);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .err details {
    margin-top: 10px;
    color: var(--fg-dim);
  }
  .err details summary {
    cursor: pointer;
    color: var(--fg-faint);
    font-size: 11px;
    user-select: none;
    padding: 4px 0;
  }
  .err details summary:hover { color: var(--fg-dim); }
  .err details[open] summary { color: var(--fg-dim); }
  .err-details {
    margin: 6px 0 0 0;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--fg-faint);
    font-family: var(--mono);
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow-y: auto;
  }

  footer {
    flex: 0 0 auto;
    background: var(--bg-2);
    border-top: 1px solid var(--line);
    padding: 14px max(20px, calc((100vw - 880px) / 2));
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 14px;
    resize: none;
    line-height: 1.5;
    max-height: 200px;
    transition: border-color 0.15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .send {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 0 20px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: opacity 0.15s;
    flex: 0 0 auto;
  }
  .send:hover { opacity: 0.85; }
  .send:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint {
    color: var(--fg-faint);
    font-size: 11px;
    font-family: var(--mono);
    margin-top: 6px;
    text-align: right;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="status-dot" title="api status"></span>
    <span>codesmith</span>
    <span style="color: var(--fg-faint); font-weight: 400;">- hybrid coder agent</span>
  </div>
  <div class="meta" id="meta">
    <span>loading...</span>
  </div>
  <div class="controls">
    <label class="toggle" title="Show internal tool steps and debug trace">
      <input type="checkbox" id="debug-steps" />
      <span>debug</span>
    </label>
    <div>
      <select id="model-profile" title="Choose the model profile used for new turns">
        <option value="">loading models...</option>
      </select>
      <div class="model-status" id="model-status">detecting local models...</div>
    </div>
    <button id="new-session" title="Drop current session and start fresh">new session</button>
  </div>
</header>

<main id="chat">
  <div class="empty" id="empty">
    <h1>codesmith</h1>
    <div>Ask for code, debugging, or a quick explanation and the agent will handle the rest.</div>
    <div class="examples">
      <button data-prompt="Write a Fibonacci function in Python and verify it for n=10.">fib(10)</button>
      <button data-prompt="Create hello.py with print('hi') and run it.">create + run hello.py</button>
      <button data-prompt="How many prime numbers are between 1 and 1000? Count them in the sandbox.">primes <= 1000</button>
    </div>
  </div>
</main>

<aside class="runs-panel" id="runs-panel">
  <div class="runs-head">
    <span>recent runs</span>
    <button class="refresh" id="runs-refresh" title="Reload runs">refresh</button>
  </div>
  <div class="runs-body" id="runs-body">
    <div class="runs-empty">loading…</div>
  </div>
</aside>

<footer>
  <div class="input-row">
    <textarea
      id="input"
      placeholder="Type a message... (Ctrl+Enter to send)"
      rows="2"
    ></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint">Ctrl+Enter - send · Esc - cancel · sandbox: docker, network=none</div>
</footer>

<script>
const $ = (sel) => document.querySelector(sel);
const chatEl = $('#chat');
const emptyEl = $('#empty');
const inputEl = $('#input');
const sendBtn = $('#send');
const statusDot = $('#status-dot');
const metaEl = $('#meta');
const newSessionBtn = $('#new-session');
const modelProfileEl = $('#model-profile');
const modelStatusEl = $('#model-status');
const debugStepsEl = $('#debug-steps');
const runsPanelEl = $('#runs-panel');
const runsBodyEl = $('#runs-body');
const runsRefreshBtn = $('#runs-refresh');

let sessionId = null;
let inflight = null; // { abort: () => void }
let currentProfileKey = null;
let modelProfiles = [];

const DEBUG_STORAGE_KEY = 'codesmith.debugSteps';
const PROFILE_STORAGE_KEY = 'codesmith.modelProfile';

// ---- helpers ----
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function clearEmpty() {
  if (emptyEl && emptyEl.parentNode) emptyEl.remove();
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function shortArgs(keys) {
  if (!keys || keys.length === 0) return '()';
  return '(' + keys.join(', ') + ')';
}

// ---- safe markdown-light renderer ----
// Only supports fenced code blocks, inline code, headings, and bullet lists.
// Everything goes through textContent so there's no HTML injection surface.
function renderMarkdownInto(container, text) {
  container.innerHTML = '';
  container.classList.add('md');
  if (!text) {
    container.appendChild(document.createTextNode(''));
    return;
  }

  // Split on fenced code blocks first so their bodies don't get interpreted.
  const parts = [];
  const fenceRe = /```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g;
  let lastIdx = 0;
  let m;
  while ((m = fenceRe.exec(text)) !== null) {
    if (m.index > lastIdx) {
      parts.push({ type: 'prose', text: text.slice(lastIdx, m.index) });
    }
    parts.push({ type: 'code', lang: m[1] || '', body: m[2] });
    lastIdx = m.index + m[0].length;
  }
  if (lastIdx < text.length) {
    parts.push({ type: 'prose', text: text.slice(lastIdx) });
  }

  for (const part of parts) {
    if (part.type === 'code') {
      const pre = document.createElement('pre');
      if (part.lang) {
        const tag = document.createElement('span');
        tag.className = 'lang';
        tag.textContent = part.lang;
        pre.appendChild(tag);
      }
      const codeEl = document.createElement('code');
      codeEl.textContent = part.body.replace(/\n$/, '');
      pre.appendChild(codeEl);
      container.appendChild(pre);
      continue;
    }
    renderProse(container, part.text);
  }
}

function renderProse(container, text) {
  const lines = text.split('\n');
  let paragraphBuf = [];
  let listBuf = [];

  const flushParagraph = () => {
    if (paragraphBuf.length === 0) return;
    const p = document.createElement('p');
    appendInline(p, paragraphBuf.join(' '));
    container.appendChild(p);
    paragraphBuf = [];
  };
  const flushList = () => {
    if (listBuf.length === 0) return;
    const ul = document.createElement('ul');
    for (const item of listBuf) {
      const li = document.createElement('li');
      appendInline(li, item);
      ul.appendChild(li);
    }
    container.appendChild(ul);
    listBuf = [];
  };

  for (const rawLine of lines) {
    const line = rawLine.replace(/\s+$/, '');
    if (!line.trim()) {
      flushParagraph();
      flushList();
      continue;
    }
    const headingMatch = line.match(/^(#{1,3})\s+(.*)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      const level = headingMatch[1].length;
      const h = document.createElement('h' + level);
      appendInline(h, headingMatch[2]);
      container.appendChild(h);
      continue;
    }
    const listMatch = line.match(/^\s*[-*]\s+(.*)$/);
    if (listMatch) {
      flushParagraph();
      listBuf.push(listMatch[1]);
      continue;
    }
    flushList();
    paragraphBuf.push(line);
  }
  flushParagraph();
  flushList();
}

function appendInline(parent, text) {
  // Only inline construct we understand is `code` between backticks.
  const codeRe = /`([^`\n]+)`/g;
  let lastIdx = 0;
  let m;
  while ((m = codeRe.exec(text)) !== null) {
    if (m.index > lastIdx) {
      parent.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
    }
    const codeEl = document.createElement('code');
    codeEl.textContent = m[1];
    parent.appendChild(codeEl);
    lastIdx = m.index + m[0].length;
  }
  if (lastIdx < text.length) {
    parent.appendChild(document.createTextNode(text.slice(lastIdx)));
  }
}

async function refreshRunsPanel() {
  if (!runsBodyEl) return;
  if (!debugStepsEnabled()) return;
  try {
    const r = await fetch('/api/runs?limit=20');
    if (!r.ok) throw new Error('runs fetch failed: ' + r.status);
    const payload = await r.json();
    renderRuns(payload.runs || []);
  } catch (e) {
    runsBodyEl.innerHTML = '';
    runsBodyEl.appendChild(el('div', { class: 'runs-empty', text: 'failed to load: ' + e.message }));
  }
}

function renderRuns(runs) {
  if (!runsBodyEl) return;
  runsBodyEl.innerHTML = '';
  if (!runs || runs.length === 0) {
    runsBodyEl.appendChild(el('div', { class: 'runs-empty', text: '(no runs logged yet)' }));
    return;
  }
  for (const r of runs) {
    const item = el('div', { class: 'run-item' });

    // Top line: short timestamp + profile + flag badge
    const tsShort = (r.ts || '').slice(11, 19) || (r.ts || '').slice(0, 10);
    const flagCls = r.error ? 'err' : (r.forced_final ? 'forced' : 'ok');
    const flagText = r.error ? 'error' : (r.forced_final ? 'forced' : 'ok');
    const top = el('div', { class: 'top' },
      el('span', { text: tsShort + '  ' + (r.profile || '-') }),
      el('span', { class: 'flag ' + flagCls, text: flagText })
    );
    item.appendChild(top);

    // Model + stats line
    const modelLine = (r.provider || '') + '/' + (r.model || '');
    item.appendChild(el('div', { class: 'stats' },
      el('span', { text: modelLine }),
      el('span', { text: 'steps:' + (r.steps || 0) }),
      el('span', { text: 'tok:' + (r.tokens || 0) }),
      el('span', { text: (r.duration_ms || 0) + 'ms' })
    ));

    if (r.error) {
      item.appendChild(el('div', { class: 'msg', text: r.error }));
    } else if (r.user_message) {
      item.appendChild(el('div', { class: 'msg', text: r.user_message }));
    }
    runsBodyEl.appendChild(item);
  }
}

function setRunsPanelVisible(visible) {
  if (!runsPanelEl) return;
  if (visible) {
    runsPanelEl.classList.add('visible');
    refreshRunsPanel();
  } else {
    runsPanelEl.classList.remove('visible');
  }
}

function attachCopyButton(parent, getText) {
  const row = el('div', { class: 'copy-row' });
  const btn = el('button', { class: 'copy-btn', text: 'copy' });
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(getText());
      btn.textContent = 'copied';
      btn.classList.add('done');
      setTimeout(() => {
        btn.textContent = 'copy';
        btn.classList.remove('done');
      }, 1500);
    } catch (e) {
      btn.textContent = 'copy failed';
    }
  });
  row.appendChild(btn);
  parent.appendChild(row);
}

function currentModelProfile() {
  return modelProfileEl && modelProfileEl.value ? modelProfileEl.value : null;
}

function debugStepsEnabled() {
  return !!(debugStepsEl && debugStepsEl.checked);
}

function updateModelStatus() {
  if (!modelStatusEl) return;
  const selected = modelProfiles.find((item) => item.key === currentModelProfile());
  if (!selected) {
    modelStatusEl.textContent = 'no model profile selected';
    return;
  }
  const status = selected.available ? 'ready' : 'needs setup';
  modelStatusEl.textContent = selected.label + ' - ' + status;
}

// ---- session management ----
async function loadModels() {
  try {
    const r = await fetch('/api/models');
    if (!r.ok) throw new Error('model catalog failed');
    const payload = await r.json();
    modelProfiles = payload.profiles || [];

    const saved = localStorage.getItem(PROFILE_STORAGE_KEY);
    const preferred = modelProfiles.some((item) => item.key === saved)
      ? saved
      : payload.default_model_profile;

    modelProfileEl.innerHTML = '';
    for (const item of modelProfiles) {
      const suffix = item.available ? '' : ' [setup]';
      const option = el('option', {
        value: item.key,
        text: item.label + ' - ' + item.primary_model + suffix,
      });
      modelProfileEl.appendChild(option);
    }
    if (preferred && modelProfiles.some((item) => item.key === preferred)) {
      modelProfileEl.value = preferred;
    }
    currentProfileKey = modelProfileEl.value;
    updateModelStatus();
  } catch (e) {
    modelProfiles = [];
    modelProfileEl.innerHTML = '';
    modelProfileEl.appendChild(el('option', { value: '', text: 'models unavailable' }));
    modelStatusEl.textContent = 'failed to load model catalog';
  }
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch('/api/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model_profile: currentModelProfile() }),
  });
  if (!r.ok) throw new Error('failed to create session');
  const data = await r.json();
  sessionId = data.session_id;
  currentProfileKey = data.model_profile || currentModelProfile();
  if (currentProfileKey && modelProfileEl) {
    modelProfileEl.value = currentProfileKey;
    localStorage.setItem(PROFILE_STORAGE_KEY, currentProfileKey);
    updateModelStatus();
  }
  return sessionId;
}

async function dropSession() {
  if (!sessionId) return;
  try { await fetch('/api/sessions/' + sessionId, { method: 'DELETE' }); }
  catch (e) { /* ignore */ }
  sessionId = null;
}

// ---- info / health ----
async function loadInfo() {
  try {
    const r = await fetch('/api/info');
    if (!r.ok) throw new Error('info failed');
    const info = await r.json();
    metaEl.innerHTML = '';
    const items = [
      ['profile', info.default_model_profile],
      ['llm', info.primary_provider + '/' + info.primary_model],
      ['sandbox', info.sandbox_image + '  ' + info.sandbox_memory_mb + 'MB · ' + info.sandbox_cpus + 'cpu · ' + info.sandbox_timeout_s + 's'],
      ['v', info.version],
    ];
    for (const [label, val] of items) {
      const span = el('span', {}, label + ': ', el('b', { text: val }));
      metaEl.appendChild(span);
    }
    statusDot.classList.remove('bad');
    statusDot.title = 'api ok';
  } catch (e) {
    statusDot.classList.add('bad');
    statusDot.title = 'api unreachable';
    metaEl.innerHTML = '';
    metaEl.appendChild(el('span', { text: 'api unreachable' }));
  }
}

// ---- sending ----
async function send() {
  const message = inputEl.value.trim();
  if (!message) return;
  if (inflight) return;

  clearEmpty();
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  try {
    await ensureSession();
  } catch (e) {
    showError('Failed to create session: ' + e.message);
    sendBtn.disabled = false;
    return;
  }

  // Render user turn
  const userTurn = el('div', { class: 'turn user' },
    el('div', { class: 'who', text: 'you' }),
    el('div', { class: 'bubble', text: message })
  );
  chatEl.appendChild(userTurn);

  // Assistant turn shell
  const assistantTurn = el('div', { class: 'turn assistant' },
    el('div', { class: 'who', text: 'codesmith' }),
  );
  const stepsContainer = el('div', { class: 'steps' });
  const typingEl = el('div', { class: 'typing', text: 'agent thinking' });
  assistantTurn.appendChild(typingEl);
  assistantTurn.appendChild(stepsContainer);
  const finalBubble = el('div', { class: 'bubble', style: 'display: none;' });
  assistantTurn.appendChild(finalBubble);
  const statsEl = el('div', { class: 'stats', style: 'display: none;' });
  assistantTurn.appendChild(statsEl);
  chatEl.appendChild(assistantTurn);
  scrollToBottom();

  // POST + streaming with fetch (EventSource doesn't support POST bodies)
  const controller = new AbortController();
  inflight = { abort: () => controller.abort() };

  let resp;
  try {
    resp = await fetch('/api/sessions/' + sessionId + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ message, model_profile: currentModelProfile() }),
      signal: controller.signal,
    });
  } catch (e) {
    typingEl.remove();
    showError('Request failed: ' + e.message, assistantTurn);
    inflight = null;
    sendBtn.disabled = false;
    return;
  }

  if (!resp.ok || !resp.body) {
    typingEl.remove();
    showError('HTTP ' + resp.status + ': ' + resp.statusText, assistantTurn);
    inflight = null;
    sendBtn.disabled = false;
    return;
  }

  // Parse SSE stream
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let sawTerminalEvent = false;

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      buf = normalizeSSEBuffer(buf);

      // Split events by blank line
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const event = parseSSE(raw);
        if (!event) continue;
        handleEvent(event, { stepsContainer, typingEl, finalBubble, statsEl, assistantTurn });
        if (event.event === 'final' || event.event === 'error') {
          sawTerminalEvent = true;
        }
        scrollToBottom();
      }
    }
    buf += decoder.decode();
    buf = normalizeSSEBuffer(buf);
    if (buf.trim()) {
      const event = parseSSE(buf);
      if (event) {
        handleEvent(event, { stepsContainer, typingEl, finalBubble, statsEl, assistantTurn });
        if (event.event === 'final' || event.event === 'error') {
          sawTerminalEvent = true;
        }
        scrollToBottom();
      }
    }
    if (!sawTerminalEvent) {
      showError('Stream ended before a final answer arrived.', assistantTurn);
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      showError('Stream failed: ' + e.message, assistantTurn);
    }
  } finally {
    typingEl.remove();
    inflight = null;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function normalizeSSEBuffer(raw) {
  return raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

function parseSSE(raw) {
  const lines = raw.split('\n');
  let event = 'message';
  let data = '';
  for (const line of lines) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; }
  catch { return { event, data: {} }; }
}

function handleEvent(ev, ctx) {
  if (ev.event === 'ping') return;

  if (ev.event === 'start') {
    ctx.typingEl.textContent = 'agent thinking';
    if (ev.data && ev.data.model && ev.data.provider) {
      modelStatusEl.textContent = ev.data.provider + '/' + ev.data.model;
    }
    return;
  }

  if (ev.event === 'step') {
    if (!debugStepsEnabled()) return;
    const d = ev.data;
    const stepEl = el('div', { class: 'step open' });
    const toolNames = (d.tool_calls || []).map(tc => tc.name + shortArgs(tc.args_keys));
    const headLeft = el('div', { class: 'left' },
      el('span', { class: 'iter', text: 'step ' + d.iteration }),
      toolNames.length > 0
        ? el('span', { class: 'tool-name', text: toolNames.join(', ') })
        : el('span', { text: 'final response' })
    );
    const headRight = el('span', { text: (d.tokens || 0) + ' tok - click to toggle' });
    const head = el('div', { class: 'head' }, headLeft, headRight);
    head.addEventListener('click', () => stepEl.classList.toggle('open'));

    const body = el('div', { class: 'body' });
    if (d.assistant_text && d.assistant_text.trim()) {
      body.appendChild(el('div', { class: 'text', text: d.assistant_text }));
    }
    for (const tr of (d.tool_results || [])) {
      body.appendChild(el('div', {
        class: 'tool-result' + (tr.ok ? '' : ' bad'),
        text: tr.preview || '(empty)',
      }));
    }
    if (!body.children.length) {
      body.appendChild(el('div', { class: 'text', style: 'color: var(--fg-faint);', text: '(no content)' }));
    }
    stepEl.appendChild(head);
    stepEl.appendChild(body);
    ctx.stepsContainer.appendChild(stepEl);
    return;
  }

  if (ev.event === 'final') {
    const d = ev.data;
    ctx.typingEl.remove();
    const text = d.text || '(no text)';
    ctx.finalBubble.style.display = '';
    renderMarkdownInto(ctx.finalBubble, text);
    if (d.text) {
      attachCopyButton(ctx.finalBubble, () => d.text);
    }
    ctx.statsEl.style.display = '';
    ctx.statsEl.innerHTML = '';
    ctx.statsEl.appendChild(el('span', { text: 'steps: ' + d.steps }));
    ctx.statsEl.appendChild(el('span', { text: 'tokens: ' + d.tokens }));
    if (d.forced_final) {
      ctx.statsEl.appendChild(el('span', { class: 'warn', text: 'forced final (guardrail)' }));
    }
    if (d.hit_limit) {
      ctx.statsEl.appendChild(el('span', { class: 'warn', text: 'warning: hit iteration limit' }));
    }
    refreshRunsPanel();
    return;
  }

  if (ev.event === 'error') {
    ctx.typingEl.remove();
    showError(ev.data.error || 'unknown error', ctx.assistantTurn, ev.data.details);
    refreshRunsPanel();
    return;
  }
}

function showError(msg, parent, details) {
  const children = [
    el('b', { text: 'agent error' }),
    document.createTextNode(msg || 'unknown error'),
  ];
  if (details) {
    const summary = el('summary', { text: 'show details' });
    const pre = el('pre', { class: 'err-details', text: details });
    const det = document.createElement('details');
    det.appendChild(summary);
    det.appendChild(pre);
    children.push(document.createTextNode('\n'));
    children.push(det);
  }
  const errEl = el('div', { class: 'err' }, ...children);
  (parent || chatEl).appendChild(errEl);
  scrollToBottom();
}

// ---- input UX ----
inputEl.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    send();
  }
  if (e.key === 'Escape' && inflight) {
    inflight.abort();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});
sendBtn.addEventListener('click', send);
debugStepsEl.checked = localStorage.getItem(DEBUG_STORAGE_KEY) === 'true';
debugStepsEl.addEventListener('change', () => {
  localStorage.setItem(DEBUG_STORAGE_KEY, debugStepsEl.checked ? 'true' : 'false');
  setRunsPanelVisible(debugStepsEl.checked);
});
if (runsRefreshBtn) {
  runsRefreshBtn.addEventListener('click', () => refreshRunsPanel());
}
setRunsPanelVisible(debugStepsEl.checked);
modelProfileEl.addEventListener('change', async () => {
  localStorage.setItem(PROFILE_STORAGE_KEY, modelProfileEl.value);
  currentProfileKey = modelProfileEl.value;
  updateModelStatus();
  if (sessionId) {
    await dropSession();
    chatEl.innerHTML = '';
    chatEl.appendChild(emptyEl);
  }
});
newSessionBtn.addEventListener('click', async () => {
  if (inflight) inflight.abort();
  await dropSession();
  chatEl.innerHTML = '';
  chatEl.appendChild(emptyEl);
  inputEl.focus();
});

document.addEventListener('click', (e) => {
  if (e.target.matches('.examples button')) {
    inputEl.value = e.target.dataset.prompt;
    inputEl.focus();
  }
});

loadInfo();
loadModels();
inputEl.focus();
</script>
</body>
