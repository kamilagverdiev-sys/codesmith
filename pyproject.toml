[project]
name = "codesmith"
version = "0.1.0"
description = "Hybrid multi-agent AI coder with sandboxed execution and self-repair"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # LLM layer — handles all providers (Anthropic, OpenAI, Ollama, ...)
    "litellm>=1.50.0",

    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # CLI
    "typer>=0.12",
    "rich>=13.7",

    # Sandbox — Docker execution
    "docker>=7.0",

    # HTTP server (Phase 3)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Phase 2: long-term memory
memory = [
    "mempalace",  # install from PyPI once stable, or from local path
    "chromadb>=0.5",
]

# Phase 2: web search
web = [
    "httpx>=0.27",
]

# Dev
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
codesmith = "codesmith.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesmith"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]  # long lines handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
